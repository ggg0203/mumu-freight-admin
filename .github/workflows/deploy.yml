# ==================== 部署流水线 ====================
# 手动触发，部署到远程服务器
# 
# 使用前需要配置 GitHub Secrets:
#   - DEPLOY_HOST: 服务器 IP/域名
#   - DEPLOY_USER: SSH 用户名
#   - DEPLOY_KEY:  SSH 私钥
#   - DEPLOY_PORT: SSH 端口 (默认 22)
#   - DASHSCOPE_API_KEY: 通义千问 API Key (可选)

name: Deploy - 部署到服务器

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "部署环境"
        required: true
        type: choice
        options:
          - production
          - staging
        default: "production"

jobs:
  deploy:
    name: 部署
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: SSH 远程部署
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script: |
            # 进入项目目录（首次部署需先 git clone）
            cd /opt/mumu-freight || git clone https://github.com/${{ github.repository }}.git /opt/mumu-freight && cd /opt/mumu-freight

            # 拉取最新代码
            git pull origin main

            # 创建 .env 文件（首次部署）
            if [ ! -f .env ]; then
              echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)" > .env
              echo "MYSQL_DATABASE=mumu_freight" >> .env
              echo "DB_HOST=mysql" >> .env
              echo "DB_PORT=3306" >> .env
              echo "DB_USER=root" >> .env
              echo "DB_NAME=mumu_freight" >> .env
              echo "DASHSCOPE_API_KEY=${{ secrets.DASHSCOPE_API_KEY || '' }}" >> .env
            fi

            # 重新构建并启动
            docker compose down
            docker compose build --no-cache
            docker compose up -d

            # 等待服务就绪
            sleep 10

            # 健康检查
            curl -f http://localhost/api/dashboard/stats || echo "⚠️ 后端健康检查失败"
            echo ""
            echo "========================================"
            echo "  ✅ 部署完成！"
            echo "  访问地址: http://${{ secrets.DEPLOY_HOST }}"
            echo "========================================"
