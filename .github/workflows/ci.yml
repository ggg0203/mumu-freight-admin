# ==================== CI 流水线 ====================
# 触发条件: push 到 main/master 分支、PR 到 main/master
# 执行内容: 前端构建 + 后端检查 + Docker 镜像构建

name: CI - Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ==================== 前端构建 ====================
  frontend-build:
    name: 前端构建 (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 安装依赖
        run: npm ci

      - name: ESLint 检查
        run: npm run lint || echo "⚠️ Lint 检查有警告"

      - name: Vite 构建（esbuild，跳过 tsc 类型检查）
        run: npx vite build
        env:
          VITE_API_BASE_URL: /api
          VITE_APP_TITLE: 幕幕货运管理系统

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  # ==================== 后端检查 ====================
  backend-check:
    name: 后端检查 (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: Python 语法检查
        run: python -m py_compile main.py && python -m py_compile database.py && python -m py_compile models.py && python -m py_compile schemas.py

      - name: 检查导入
        run: python -c "import sys; sys.path.insert(0, '.'); from crud import *; print('✅ 所有模块导入成功')"

  # ==================== Docker 镜像构建 ====================
  docker-build:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-check]
    # 仅在 push 到 main/master 时构建 Docker 镜像
    if: github.event_name == 'push'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建后端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: mumu-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建前端+Nginx 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: mumu-nginx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_APP_TITLE=幕幕货运管理系统

      - name: 验证镜像
        run: |
          echo "✅ 后端镜像构建成功: mumu-backend:latest"
          echo "✅ 前端镜像构建成功: mumu-nginx:latest"
          docker images mumu-backend mumu-nginx
